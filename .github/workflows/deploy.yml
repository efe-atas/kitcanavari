name: deploy

on:
  push:
    branches: [main]
    paths: ['web/**', 'data/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_data: ${{ steps.data.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # when called after a scrape, pick up the data commit it just pushed

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build
        working-directory: web
        run: |
          npm ci
          npx vitest run
          npm run build

      - name: Check for data
        id: data
        run: |
          if [ -f data/courses.json ] && [ -f data/changes.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::data/ is empty — run the scrape workflow first; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bundle data
        if: steps.data.outputs.ok == 'true'
        run: |
          rm -rf web/dist/data
          mkdir -p web/dist/data
          cp data/*.json web/dist/data/
          if [ -d data/career ]; then cp -r data/career web/dist/data/; fi
          if [ -f data/next/courses.json ]; then mkdir -p web/dist/data/next && cp data/next/courses.json web/dist/data/next/; fi
          # Smaller downloads: the JSON is written pretty-printed; serve it compact.
          for f in $(find web/dist/data -name '*.json'); do python3 -c "import json,sys; p=sys.argv[1]; d=json.load(open(p)); json.dump(d, open(p,'w'), separators=(',',':'), ensure_ascii=False)" "$f"; done

      - uses: actions/upload-pages-artifact@v3
        if: steps.data.outputs.ok == 'true'
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.has_data == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
