name: deploy

on:
  push:
    branches: [main]
    paths: ['web/**', 'data/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # when called after a scrape, pick up the data commit it just pushed

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build
        working-directory: web
        run: |
          npm ci
          npx vitest run
          npm run build

      - name: Bundle data
        run: |
          rm -rf web/dist/data
          mkdir -p web/dist/data
          cp data/courses.json data/changes.json web/dist/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
