name: ci

# Tests and a production build for every branch and pull request; main is covered by deploy.yml.
on:
  push:
    branches-ignore: [main]
    paths: ['web/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['web/**', 'data/**', '.github/workflows/ci.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build
        working-directory: web
        run: |
          npm ci
          npx vitest run
          npm run build
