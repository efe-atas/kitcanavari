[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kit_scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["playwright>=1.45", "beautifulsoup4>=4.12", "lxml>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["kit_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
