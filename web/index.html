<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KIT Planım" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KIT Planım</title>
    <script>
      // Theme and language before the first paint, so a dark-mode visit never flashes white.
      try {
        var s = JSON.parse(localStorage.getItem('kitcanavari:v1') || '{}')
        var dark = s.theme ? s.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (s.lang === 'tr' || s.lang === 'en' || s.lang === 'de') document.documentElement.lang = s.lang
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#f6f3ec" />
    <meta name="description" content="KIT Computer Science Master: plan your degree term by term, build your weekly timetable and track catalog changes." />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
